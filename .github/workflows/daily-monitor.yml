name: Event monitor (2x daily)

on:
  schedule:
    # 07:00 UTC — after Asia close (Tokyo 16:00): catches BOJ / Japan-session events
    - cron: "0 7 * * *"
    # 22:00 UTC — after US close (NY 17:00/18:00): catches Fed / US-session events
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install WeasyPrint system deps + CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 \
            fonts-dejavu-core fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_daily.py

      - name: Compute snapshot + anomalies (+ stress log)
        run: python scripts/analyze.py

      - name: Generate Markdown report (archive for weekly history)
        run: python scripts/report.py

      # No routine daily email — the user only receives the weekly report
      # plus immediate alerts when a material event is detected below.

      - name: Detect material events (numeric triggers + AI news scan)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT_SCAN_MODEL: ${{ vars.EVENT_SCAN_MODEL || 'claude-opus-4-7' }}
          EVENT_ANALYSIS_MODEL: ${{ vars.EVENT_ANALYSIS_MODEL || 'claude-opus-4-7' }}
        run: python scripts/event_monitor.py

      - name: Generate event-alert PDF (only if event detected)
        run: python scripts/pdf.py event

      - name: Send immediate alert (only if event detected)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python scripts/notify.py event

      - name: Commit data + reports
        run: |
          git config user.name  "bond-monitor[bot]"
          git config user.email "bond-monitor@users.noreply.github.com"
          git add data/ reports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "monitor: daily snapshot $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              if git push; then
                exit 0
              fi
              sleep $((2 ** i))
            done
            git push
          fi
