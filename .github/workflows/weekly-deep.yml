name: Weekly deep analysis

on:
  schedule:
    # Saturday 13:00 UTC = Saturday 21:00 Beijing (UTC+8)
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install WeasyPrint system deps + CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 \
            fonts-dejavu-core fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt

      # Ensure today's snapshot is fresh (in case daily hasn't run yet today)
      - name: Refresh indicators
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_daily.py

      - name: Recompute daily snapshot
        run: python scripts/analyze.py

      - name: Build weekly aggregate
        run: python scripts/weekly_report.py

      - name: Generate AI narrative (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_narrative.py

      - name: Generate weekly PDF
        run: python scripts/pdf.py weekly

      - name: Email weekly PDF
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ALWAYS_SEND: "1"
        run: python scripts/notify.py weekly

      - name: Commit weekly artifacts
        run: |
          git config user.name  "bond-monitor[bot]"
          git config user.email "bond-monitor@users.noreply.github.com"
          git add data/weekly_snapshot.json reports/weekly/
          if git diff --cached --quiet; then
            echo "No weekly changes to commit."
          else
            git commit -m "weekly: deep analysis $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              if git push; then
                exit 0
              fi
              sleep $((2 ** i))
            done
            git push
          fi
